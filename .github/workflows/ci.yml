on: [push, pull_request]
name: CI
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # show all CI failures rather than stopping CI on first failure
      matrix:
        node-version: [22.x, 24.x, 26.x]
        os: [ubuntu-latest, macos-latest, windows-latest]
        express-version: [4, 5] # express is a peer dependency, so the suite runs against every major roosevelt claims to support
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Upgrade npm so its node-gyp knows Visual Studio 2026 # npm uses the node-gyp it carries internally, which cannot be swapped out, and npm 12 is the first to carry one that builds better-sqlite3 on windows
        if: runner.os == 'Windows'
        run: npm install -g npm@12
      - run: npm ci
      - name: Install Express ${{ matrix.express-version }}
        run: npm install express@${{ matrix.express-version }} --no-save
      - run: npm run lint
      - run: npm run coverage

  trust-store:
    # the rest of the suite can only ever observe an untrusted certificate, which is also what a platform whose trust store roosevelt cannot read would report, so this installs a real authority and checks roosevelt sees it
    #
    # it runs on its own rather than inside the matrix above because it writes to the machine's trust store, which is not something to do over and over on the same runner
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10 # this job writes to a real trust store, and a platform that decides to prompt instead of failing would otherwise sit there until the six hour default runs out
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: Upgrade npm so its node-gyp knows Visual Studio 2026
        if: runner.os == 'Windows'
        run: npm install -g npm@12
      - run: npm ci
      - run: npm run test-trust-store
        env:
          ROOSEVELT_TEST_OS_TRUST_STORE: '1' # without this the test skips itself, so that running the suite on a laptop never touches its trust store

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - run: npm ci
      - run: npm run test-package # checks the package as npm would publish it, which the test suite cannot do since it runs against this repo
